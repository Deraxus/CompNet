---
- name: Update apk cache
  apk:
    update_cache: yes
  become: yes

- name: Install prerequisites
  apk:
    name:
      - curl
      - ca-certificates
      - openrc
    state: present
    update_cache: no
  become: yes

- name: Check if Caddy binary exists
  stat:
    path: /usr/local/bin/caddy
  register: caddy_binary

- name: Download Caddy binary
  get_url:
    url: https://caddyserver.com/api/download?os=linux&arch=amd64
    dest: /usr/local/bin/caddy
    mode: '0755'
  become: yes
  when: not caddy_binary.stat.exists

- name: Test Caddy binary
  command: /usr/local/bin/caddy version
  register: caddy_version
  changed_when: false

- name: Display Caddy version
  debug:
    msg: "Caddy version: {{ caddy_version.stdout_lines[0] }}"

- name: Create caddy group
  group:
    name: caddy
    system: yes
  become: yes

- name: Create caddy user
  user:
    name: caddy
    system: yes
    shell: /sbin/nologin
    home: /var/lib/caddy
    group: caddy
    create_home: yes
  become: yes

- name: Create web root directory
  file:
    path: /var/www/html
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'
  become: yes

- name: Create custom index.html
  copy:
    dest: /var/www/html/index.html
    content: |
      <!DOCTYPE html>
      <html lang="ru">
      <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Лабораторная работа №2</title>
          <style>
              body {
                  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  height: 100vh;
                  margin: 0;
              }
              .container {
                  background: white;
                  padding: 50px;
                  border-radius: 20px;
                  box-shadow: 0 20px 60px rgba(0,0,0,0.3);
                  text-align: center;
                  max-width: 600px;
              }
              h1 {
                  color: #667eea;
                  margin-bottom: 20px;
              }
              p {
                  color: #555;
                  font-size: 18px;
                  line-height: 1.6;
              }
              .badge {
                  display: inline-block;
                  background: #667eea;
                  color: white;
                  padding: 10px 20px;
                  border-radius: 25px;
                  margin-top: 20px;
                  font-weight: bold;
              }
              .info {
                  background: #f0f0f0;
                  padding: 15px;
                  border-radius: 10px;
                  margin-top: 20px;
                  font-size: 14px;
                  color: #666;
              }
              .alpine {
                  color: #0D597F;
                  font-weight: bold;
              }
          </style>
      </head>
      <body>
          <div class="container">
              <h1>Ansible + Caddy</h1>
              <p><strong>Лабораторная работа №2</strong></p>
              <p>Веб-сервер Caddy успешно установлен и настроен с помощью Ansible</p>
              <div class="info">
                  ✓ Кастомная HTML страница<br>
                  ✓ Дополнительные HTTP заголовки<br>
                  ✓ JSON логирование<br>
                  ✓ Автоматизация через playbook<br>
                  ✓ Работает на <span class="alpine">Alpine Linux</span>
              </div>
              <div class="badge">Deployed with Automation</div>
          </div>
      </body>
      </html>
    owner: caddy
    group: caddy
    mode: '0644'
  become: yes

- name: Create Caddy config directory
  file:
    path: /etc/caddy
    state: directory
    owner: root
    group: root
    mode: '0755'
  become: yes

- name: Create log directory
  file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: '0755'
  become: yes

- name: Create config file from template
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: '0644'
  become: yes

- name: Stop any running Caddy processes
  shell: |
    pkill -f "caddy run" || true
    sleep 1
  become: yes
  changed_when: false
  failed_when: false

- name: Wait for process termination
  pause:
    seconds: 1

- name: Start Caddy in background with nohup
  shell: |
    nohup /usr/local/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile > /var/log/caddy/caddy.log 2>&1 &
    sleep 2
  become: yes
  args:
    executable: /bin/sh
  changed_when: true

- name: Wait for Caddy to initialize
  pause:
    seconds: 2

- name: Verify Caddy is running
  shell: pgrep -f "caddy run"
  become: yes
  register: caddy_check
  changed_when: false

- name: Check Caddy listening on port 80
  wait_for:
    port: 80
    host: localhost
    delay: 1
    timeout: 5
  register: port_check
  retries: 3
  delay: 1
  until: port_check is succeeded

- name: Display startup status
  debug:
    msg: "✓ Caddy успешно запущен и слушает порт 80"
